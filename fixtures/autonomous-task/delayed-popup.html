<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>V6 Delayed Popup Fixture</title>
  </head>
  <body>
    <h1>V6 Delayed Popup</h1>
    <button type="button" id="schedule-popup">Schedule popup</button>
    <script>
      window.__v6Markers = { delayed: 0 };
      document.getElementById('schedule-popup').addEventListener('click', function () {
        window.__v6Markers.delayed += 1;
        setTimeout(function () {
          window.open('/autonomous-task/popup-child.html', 'v6-delayed');
        }, 250);
      });
    </script>
  </body>
</html>
