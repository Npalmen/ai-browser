<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>V3 Native Select Exact Target</title>
  </head>
  <body>
    <h1>V3 Native Select Exact Target</h1>
    <p>
      Intermediate unnamed options are omitted from the model-visible catalog.
      Mechanical execution must still select Charlie, not the omitted neighbor.
    </p>
    <p>
      <label>
        Exact color
        <select id="exact-select">
          <option>Alpha</option>
          <option></option>
          <option>Charlie</option>
        </select>
      </label>
    </p>
  </body>
</html>
